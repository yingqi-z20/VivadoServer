# Example for Prometheus running on the same host as VivadoServer.
# Install alerts.yml beside this file; adapt targets/TLS for remote scraping.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: vivado-server
    metrics_path: /metrics
    scrape_timeout: 10s
    scheme: http
    authorization:
      type: Bearer
      # Restricted token copy readable by the Prometheus identity. The token
      # grants full administrative API access, not metrics-only access.
      credentials_file: /etc/prometheus/secrets/vivado-server-token
    static_configs:
      - targets: ["127.0.0.1:8080"]

# Configure alerting.alertmanagers and notification routes separately.
